* { box-sizing: border-box; }

body { font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; padding: 28px 22px 80px; }
h1 { font-family: var(--serif); font-size: 28px; font-weight: 600; letter-spacing: -0.02em; margin: 0 0 6px; }
.lede, .note, .muted { color: var(--muted); }
.lede { max-width: 46rem; margin: 0 0 18px; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
header { display: flex; justify-content: space-between; gap: 24px; flex-wrap: wrap; margin-bottom: 22px; }
.counts { font-size: 13px; color: var(--muted); text-align: right; }

.chip { background: var(--card); border: 1px solid var(--line); padding: 10px 12px; min-width: 140px; }
.chip b { display: block; font-family: var(--mono); font-size: 16px; font-weight: 600; }
.chip span { display: block; font-size: 12px; color: var(--muted); text-transform: lowercase; }
.timeline { position: relative; height: 84px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); margin: 0 0 22px; }
.band { position: absolute; top: 8px; height: 14px; opacity: .35; font-size: 10px; color: var(--ink); overflow: hidden; padding-left: 4px; }
.band.holiday { background: #c9b48a; }
.band.school { background: #a3b5a0; }
.win { position: absolute; height: 8px; background: var(--ink); opacity: .55; }
.win.off { opacity: .18; }
.mark { position: absolute; bottom: 6px; font-family: var(--mono); font-size: 11px; color: var(--muted); transform: translateX(-50%); }
.mark.saved { color: var(--ink); font-weight: 700; }
.filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 0 0 16px; }
.filters button { background: transparent; border: 1px solid var(--line); color: var(--muted); padding: 5px 10px; font-size: 13px; cursor: pointer; }
.filters button.on { border-color: var(--ink); color: var(--ink); }
.filters .note { font-size: 12px; }
.tonight { margin: 0 0 22px; }
.tonight h2, .pending h2, .coverage h2 { font-family: var(--serif); font-size: 18px; font-weight: 600; margin: 0 0 10px; }
.row { border-top: 1px solid var(--line); padding: 12px 0; }
.row.demoted { opacity: .72; }
.rowhead { display: grid; grid-template-columns: 28px 1fr 160px 150px 170px 120px; gap: 12px; align-items: start; cursor: pointer; }
.rank { font-family: var(--mono); color: var(--muted); }
.row.saved .rank { color: var(--ink); font-weight: 700; }
.program { font-weight: 600; }
.program small { display: block; font-weight: 400; color: var(--muted); font-size: 12px; }
.price .blocked { text-decoration: line-through; color: var(--fail); }
.price .wait { color: var(--wait); }
.rules { font-size: 13px; }
.ok { color: var(--pass); }
.warn { color: var(--wait); }
.bad { color: var(--fail); }
.pips { letter-spacing: 2px; font-family: var(--mono); font-size: 12px; }
.school { height: 6px; background: var(--line); margin-top: 4px; }
.school i { display: block; height: 100%; background: var(--fail); }
.paymix { display: flex; height: 6px; background: var(--line); margin-top: 6px; }
.paymix i { display: block; height: 100%; background: var(--ink); }
.paymix b { display: block; height: 100%; background: #b9a58a; }
.detail { display: none; grid-column: 1 / -1; color: var(--muted); font-size: 13px; padding: 8px 0 0 40px; }
.row.open .detail { display: block; }
.detail a { color: var(--ink); }
.pending .hole { border-top: 1px solid var(--line); padding: 10px 0; }
.pending .hole.close { border-left: 3px solid var(--wait); padding-left: 10px; }
.coverage { margin-top: 28px; font-size: 13px; color: var(--muted); }
.coverage p { margin: 4px 0; }
.tail { margin-top: 16px; font-size: 13px; color: var(--muted); }
@media (max-width: 900px) {
  .rowhead { grid-template-columns: 24px 1fr 1fr; }
  .rules, .seats { grid-column: 2 / -1; }
}
</style>

const fmt = new Intl.NumberFormat("en-US");
const money = new Intl.NumberFormat("en-US", { style: "currency", currency: "USD", maximumFractionDigits: 0 });
function n(v) { return v == null ? "pending" : fmt.format(v); }
function usd(v) { return v == null ? "tax pending" : money.format(v); }
function dayPct(day) {
  const span = VIEW.timeline.span;
  const a = Date.parse(span.start), b = Date.parse(span.end), x = Date.parse(day);
  return ((x - a) / (b - a)) * 100;
}
function rangeStyle(start, end) {
  const left = dayPct(start);
  const right = dayPct(end);
  return `left:${left}%;width:${Math.max(right - left, 0.8)}%;`;
}
const active = new Set((VIEW.filters.active || []).map(f => f.id));
function hidden(row) {

}
function pips(row) {

  return `<div class="pips ${cls}">${s} ${have} of ${need} friday nights</div>`;
}
function school(row) {

  const words = row.missed_school_days ? `${row.missed_school_days} missed school days` : "no missed school";
  return `<div class="${cls}">${words}<div class="school"><i style="width:${pct}%"></i></div></div>`;
}
function price(row) {

}
function rowHtml(row) {

    <div class="rowhead">

      <div class="rules">${pips(row)}${school(row)}<div class="${row.fare.state === "banned" ? "bad" : row.fare.state === "unverified" ? "warn" : "ok"}">${row.fare.label}</div></div>

  </article>`;
}
function render() {

  document.getElementById("wallet").innerHTML = VIEW.wallet.map(w => `<div class="chip"><span>${w.label}</span><b class="mono">${n(w.amount)}</b><span>${w.how_to_spend}</span></div>`).join("");

    const id = btn.dataset.id;
    if (active.has(id)) active.delete(id); else active.add(id);
    render();
  }));
}
