* { box-sizing: border-box; }
html, body { margin: 0; background: var(--paper); color: var(--ink); }
body { font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; padding: 28px 22px 80px; }
h1 { font-family: var(--serif); font-size: 28px; font-weight: 600; letter-spacing: -0.02em; margin: 0 0 6px; }
.lede, .note, .muted { color: var(--muted); }

.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }

.wallet { display: flex; gap: 10px; flex-wrap: wrap; margin: 0 0 22px; }
.chip { background: var(--card); border: 1px solid var(--line); padding: 10px 12px; min-width: 140px; }
.chip b { display: block; font-family: var(--mono); font-size: 16px; font-weight: 600; }
.chip span { display: block; font-size: 12px; color: var(--muted); text-transform: lowercase; }
.timeline { margin: 0 0 28px; padding: 12px 0 0; border-top: 1px solid var(--line); }
.tl-legend { display: flex; flex-wrap: wrap; gap: 12px 16px; font-size: 12px; color: var(--muted); margin: 0 0 10px; }

.tl-legend .sw-holiday { background: #e6d5b3; }
.tl-legend .sw-break { background: #d5e0d3; }

.tl-grid { display: grid; grid-template-columns: 108px 1fr; gap: 6px 12px; align-items: center; }
.tl-label { font-size: 11px; color: var(--muted); text-align: right; line-height: 1.2; }
.tl-track { position: relative; height: 22px; }
.tl-track.windows { min-height: 22px; }

.tl-tip {

.row.demoted { opacity: .72; }
.rowhead { display: grid; grid-template-columns: 28px 1fr 160px 150px 170px 120px; gap: 12px; align-items: start; cursor: pointer; }
.rank { font-family: var(--mono); color: var(--muted); }
.row.saved .rank { color: var(--ink); font-weight: 700; }
.program { font-weight: 600; }
.program small { display: block; font-weight: 400; color: var(--muted); font-size: 12px; }
.price .blocked { text-decoration: line-through; color: var(--fail); }
.price .wait { color: var(--wait); }
.rules { font-size: 13px; }
.ok { color: var(--pass); }
.warn { color: var(--wait); }
.bad { color: var(--fail); }
.pips { letter-spacing: 2px; font-family: var(--mono); font-size: 12px; }

  return `<div class="${cls}">${words}<div class="school-meter"><i style="width:${pct}%"></i></div></div>`;
}
function price(row) {
  const miles = row.miles_per_person == null ? "miles pending" : `${n(row.miles_per_person)} ${row.miles_kind === "one_way" ? "OW" : "RT"} / person`;
  if (row.cash_per_person == null) {
    return `<div class="price mono"><b>${miles}</b><div class="wait">tax pending</div></div>`;
  }
  const travelers = VIEW.travelers || 3;
  const est = (row.effective_per_person == null || row.price_blocked)
    ? ""
    : `<div class="muted">est. ${usd(row.effective_per_person)} at ${row.cents_per_point}¢</div>`;
  return `<div class="price mono"><b class="${row.price_blocked ? "blocked" : ""}">${miles}</b><div>${usd(row.cash_per_person)} cash tax</div><div class="muted">${usd(row.cash_per_person * travelers)} family tax</div>${est}</div>`;
}
function mix(row) {
  const fam = row.family_miles || 0;
  const native = (row.funding && row.funding.native_miles) || 0;
  const np = fam ? (native / fam) * 100 : 0;
  const short = row.funding && row.funding.shortfall;
  const pay = `<div class="${short ? "bad" : ""}">${row.pay_line}</div>`;
  const left = row.funding && row.funding.left_after != null
    ? `<div class="muted">${n(row.funding.left_after)} left in ${row.funding.bank_label || "bank"}</div>`
    : "";
  return `${pay}${left}<div class="paymix"><i style="width:${np}%"></i><b style="width:${100-np}%"></b></div>`;
}
function rowHtml(row) {
  const mark = row.saved ? "saved" : row.state;
  const rank = row.displayRank != null ? row.displayRank : row.rank;
  const links = (row.links || []).map(l => `<a href="${l.url}" target="_blank" rel="noopener">${l.label}</a>`).join(" · ");
  const extras = [];
  if (row.deal_kind === "saver_one_way") extras.push(row.typical_miles ? `one-way saver vs typical ${n(row.typical_miles)}` : "one-way saver");
  else if (row.pricing === "airline_round_trip" || row.from_airline_site) extras.push("airline round trip");
  else if (row.pricing === "one_way_sum") extras.push("priced per direction");
  if (row.takeoff15_applied) extras.push("TakeOff15 in");
  const extra = extras.length ? ` ${extras.join(". ")}.` : "";
  return `<article class="row ${mark}" data-id="${row.id}">
    <div class="rowhead">
      <div class="rank">${rank == null ? "—" : rank}</div>
      <div class="program">${row.program}<small>${row.origin}–${row.destination}. ${row.date_label || ""}. ${row.context_line || ""}${extra}</small></div>
      ${price(row)}
      <div class="rules">${pips(row)}${school(row)}<div class="${row.fare.state === "banned" ? "bad" : row.fare.state === "unverified" ? "warn" : "ok"}">${row.fare.label}</div></div>
      <div>${mix(row)}</div>
      <div class="seats muted">${row.seats.label}</div>
      <div class="detail">${row.explainer ? `<p class="bad">${row.explainer}</p>` : ""}<p>${(row.issues || []).join(". ")}</p><p>${links}</p></div>
    </div>
  </article>`;
}
function fmtDay(day) {
  if (!day) return "date pending";
  const d = new Date(day + "T12:00:00Z");
  return d.toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short", year: "numeric", timeZone: "UTC" });
}
function layoverLine(stops) {
  if (stops == null) return "Layovers unknown";
  if (stops === 0) return "Nonstop";
  return `${stops} layover${stops === 1 ? "" : "s"}`;
}
function tripTipHtml(row) {
  const miles = row.miles_per_person == null ? "miles pending" : `${n(row.miles_per_person)} miles`;
  const cash = row.cash_per_person == null ? "tax pending" : `${usd(row.cash_per_person)} cash`;
  const nights = row.nights == null ? "length pending" : `${row.nights} nights`;
  return `<b>${row.program} · ${row.origin}–${row.destination}</b>`
    + `<span>${fmtDay(row.departure_date)} – ${fmtDay(row.return_date)}</span>`
    + `<span>${nights}</span>`
    + `<span>${layoverLine(row.stops)}</span>`
    + `<span class="mono">${miles} + ${cash} / person</span>`;
}
function placeTip(e) {
  const tip = document.getElementById("tl-tip");
  if (!tip || tip.hidden) return;
  const pad = 14;
  const x = Math.min(e.clientX + pad, window.innerWidth - tip.offsetWidth - 12);
  const y = Math.min(e.clientY + pad, window.innerHeight - tip.offsetHeight - 12);
  tip.style.left = Math.max(8, x) + "px";
  tip.style.top = Math.max(8, y) + "px";
}
function bindTripTips() {
  const tip = document.getElementById("tl-tip");
  document.querySelectorAll(".trip-bar").forEach(bar => {
    bar.addEventListener("mouseenter", e => {
      const row = VIEW.rows.find(r => r.id === bar.dataset.id);
      if (!row || !tip) return;
      tip.innerHTML = tripTipHtml(row);
      tip.hidden = false;
      placeTip(e);
    });
    bar.addEventListener("mousemove", placeTip);
    bar.addEventListener("mouseleave", () => { if (tip) tip.hidden = true; });
  });
}
function addDays(day, n) {
  const d = new Date(day + "T00:00:00Z");
  d.setUTCDate(d.getUTCDate() + n);
  return d.toISOString().slice(0, 10);
}
function mondayOf(day) {
  const d = new Date(day + "T00:00:00Z");
  const back = (d.getUTCDay() + 6) % 7;
  d.setUTCDate(d.getUTCDate() - back);
  return d.toISOString().slice(0, 10);
}
function weeklyCheapest(rows) {
  const by = new Map();
  for (const r of rows) {
    if (!r.departure_date) continue;
    const key = mondayOf(r.departure_date);
    const prev = by.get(key);
    const better = !prev
      || sortValue(r) < sortValue(prev)
      || (sortValue(r) === sortValue(prev) && r.departure_date < prev.departure_date);
    if (better) by.set(key, r);
  }
  return [...by.values()];
}
function coverageRanges(rows) {
  const days = new Set();
  for (const r of rows) {
    if (!r.departure_date || !r.return_date) continue;
    let d = r.departure_date;
    while (d < r.return_date) {
      days.add(d);
      d = addDays(d, 1);
    }
  }
  const ordered = [...days].sort();
  if (!ordered.length) return [];
  const ranges = [];
  let start = ordered[0], prev = ordered[0];
  for (let i = 1; i < ordered.length; i++) {
    if (addDays(prev, 1) === ordered[i]) {
      prev = ordered[i];
      continue;
    }
    ranges.push({ start, end: prev });
    start = prev = ordered[i];
  }
  ranges.push({ start, end: prev });
  return ranges;
}
function laneTrips(rows) {
  const occupied = [];
  return rows.map(r => {
    const start = Date.parse(r.departure_date);
    let lane = 0;
    for (; lane < occupied.length; lane++) {
      if (start > occupied[lane]) break;
    }
    occupied[lane] = Date.parse(r.return_date);
    return { ...r, lane };
  });
}
function renderTimeline() {
  const tl = VIEW.timeline;
  const lanes = Math.max(1, ...(tl.windows || []).map(w => (w.lane || 0) + 1));
  let holidays = (tl.holidays || []).map(h => `<div class="band holiday" style="${rangeStyle(h.start, h.end)}" title="${h.label}">${h.label}</div>`).join("");
  if (tl.school_break) holidays += `<div class="band break" style="${rangeStyle(tl.school_break.start, tl.school_break.end)}">${tl.school_break.label}</div>`;
  const season = tl.season
    ? `<div class="win season" style="${rangeStyle(tl.season.start, tl.season.end)}" title="Any dates in this range">${tl.season.label}</div>`
    : "";
  const wins = (tl.windows || []).map(w => `<div class="win ${w.enabled ? "" : "off"}" style="${rangeStyle(w.outbound, w.return, w.lane * 22)}" title="${w.label}">${w.label}</div>`).join("");
  const programRows = visibleRows().filter(r => r.departure_date && r.return_date);
  const rawTrips = programFilter === "all" ? VIEW.rows.filter(r => r.saved) : weeklyCheapest(programRows);
  const tripRows = laneTrips(rawTrips);
  const tripH = Math.max(1, ...tripRows.map(r => r.lane + 1), 1) * 14 + 6;
  const trips = tripRows.map(r => `<div class="trip-bar ${r.saved ? "saved" : ""}" data-id="${r.id}" style="${rangeStyle(r.departure_date, r.return_date, 4 + r.lane * 14)}"></div>`).join("");
  const cacheRows = programFilter === "all" ? VIEW.rows.filter(r => r.departure_date) : programRows;
  const cache = coverageRanges(cacheRows).map(r => `<div class="win cache" style="${rangeStyle(r.start, r.end)}" title="Complete tickets in cache"></div>`).join("");
  const tripLabel = programFilter === "all" ? "Verify tonight" : programFilter;
  const axis = (tl.months || []).map(m => `<div class="mark" style="${monthPos(m.day)}">${m.label}</div>`).join("");
  const note = programFilter === "all"
    ? "Bars are the 3 lowest-mileage tickets to verify. Pale fill is every complete round trip in cache, not a daily airline schedule."
    : `${n(programRows.length)} complete ${programFilter} tickets in cache. Bars are the cheapest departing each week. Pale fill is every date those tickets cover. Award cache is not the published timetable.`;
  document.getElementById("timeline").innerHTML = `
    <div class="tl-legend">
      <span><i class="sw-holiday"></i>Holiday</span>
      <span><i class="sw-break"></i>School break</span>
      <span><i class="sw-window"></i>Preferred dates</span>
      <span><i class="sw-season"></i>Searching these dates</span>
      <span><i class="sw-cache"></i>Dates with tickets in cache</span>
      <span><i class="sw-ticket"></i>${programFilter === "all" ? "Verify tonight tickets" : "Cheapest each week"}</span>
    </div>
    <div class="tl-grid">
      <div class="tl-label">Holidays</div>
      <div class="tl-track">${holidays}</div>
      <div class="tl-label">Preferred dates</div>
      <div class="tl-track windows" style="height:${lanes * 22}px">${wins}</div>
      <div class="tl-label">Searching</div>
      <div class="tl-track">${season}</div>
      <div class="tl-label">In cache</div>
      <div class="tl-track">${cache}</div>
      <div class="tl-label">${tripLabel}</div>
      <div class="tl-track trips" style="height:${tripH}px">${trips}</div>
      <div class="tl-label">2026–27</div>
      <div class="tl-axis">${axis}</div>
    </div>
    <p class="tl-note">${note}</p>`;
}
function boardHtml() {
  const rows = numbered(visibleRows());
  if (!rows.length) return "<p class='muted'>Nothing matches these filters.</p>";
  if (programFilter !== "all") return rows.map(rowHtml).join("");
  return grouped(rows).map(g => {
    const extra = g.rows.length > PER_PROGRAM;
    const shown = extra ? g.rows.slice(0, PER_PROGRAM) : g.rows;
    const more = extra ? `<button class="more" data-program="${g.name}">See all ${g.rows.length} ${g.name}</button>` : "";
    return `<div class="group"><div class="group-head"><h3>${g.name}</h3><span class="muted">${g.rows.length} complete</span></div>${shown.map(rowHtml).join("")}${more}</div>`;
  }).join("");
}
function render() {
  document.title = VIEW.headline;
  document.getElementById("headline").textContent = VIEW.headline;
  document.getElementById("constraints").textContent = VIEW.constraints_line;
  document.getElementById("counts").innerHTML = `${n(VIEW.counts.found)} complete in cache<br>${n(VIEW.counts.one_way_savers || 0)} one-way savers · ${n(VIEW.counts.programs)} programs · ${n(VIEW.counts.saved)} to verify<br>exported ${VIEW.exported_at}`;
  document.getElementById("wallet").innerHTML = VIEW.wallet.map(w => `<div class="chip"><span>${w.label}</span><b class="mono">${n(w.amount)}</b><span>${w.how_to_spend}</span></div>`).join("");
  renderTimeline();
  bindTripTips();
  const needles = VIEW.needles || [];
  document.getElementById("needles-note").textContent = needles.length
    ? "Cheap one-ways vs typical for that route. Flying Blue, United, and Avios sell these as tickets. Light is flagged, not hidden here. Not a round trip."
    : "No one-way savers this sweep. That means nothing stood out vs typical, not that the airline has no seats.";
  document.getElementById("needles").innerHTML = needles.length ? needles.map(rowHtml).join("") : "";
  const saved = VIEW.rows.filter(r => r.saved);
  document.getElementById("tonight-note").textContent = (VIEW.tonight && VIEW.tonight.note) || "";
  document.getElementById("tonight").innerHTML = saved.length ? saved.map(rowHtml).join("") : "<p class='muted'>No rows marked to verify.</p>";
  document.getElementById("programs").innerHTML = (VIEW.programs || []).map(p => `<button data-program="${p.id}" class="${programFilter === p.id ? "on" : ""}">${p.label} <span class="mono">${n(p.count)}</span></button>`).join("");
  const sorts = VIEW.sorts || { available: [], note: "" };
  document.getElementById("sorts").innerHTML = `<span class="note">${sorts.note || ""}</span>` + (sorts.available || []).map(s => `<button data-sort="${s.id}" class="${sortBy === s.id ? "on" : ""}">${s.label}</button>`).join("");
  document.getElementById("filters").innerHTML = `<span class="note">${VIEW.filters.note}</span>` + VIEW.filters.available.map(f => `<button data-id="${f.id}" class="${active.has(f.id) ? "on" : ""}">${f.label}</button>`).join("");
  document.getElementById("board").innerHTML = boardHtml();
  document.getElementById("pending").innerHTML = VIEW.pending.map(p => `<div class="hole ${p.close_next ? "close" : ""}"><b>${p.program}</b> ${p.program_note || ""}<div>${p.reason}</div><div class="muted">${p.balance_line || ""} · ${n(p.transferable_miles)} transferable</div>${(p.links||[]).map(l => `<a href="${l.url}" target="_blank" rel="noopener">${l.label}</a>`).join(" · ")}</div>`).join("");
  const c = VIEW.coverage;
  document.getElementById("coverage").innerHTML = `<h2>Coverage</h2><p>Has leads: ${c.has_leads.join(", ")}</p><p>Searched, cache empty: ${c.searched_empty.join(", ")}. ${c.empty_note}</p><p>Needs the airline site: ${c.needs_site.join(", ")}</p><p>Closed: ${c.closed.join(", ")}</p>`;
  document.getElementById("tail").textContent = VIEW.tail.note || "";
  document.querySelectorAll(".rowhead").forEach(el => el.addEventListener("click", e => {
    if (e.target.closest("a")) return;
    el.parentElement.classList.toggle("open");
  }));
  document.querySelectorAll(".filters button").forEach(btn => btn.addEventListener("click", () => {
    const id = btn.dataset.id;
    if (active.has(id)) active.delete(id); else active.add(id);
    render();
  }));
  document.querySelectorAll(".sorts button").forEach(btn => btn.addEventListener("click", () => {
    sortBy = btn.dataset.sort;
    render();
  }));
  document.querySelectorAll("#programs button, .more").forEach(btn => btn.addEventListener("click", () => {
    programFilter = btn.dataset.program;
    render();
  }));
}
render();
</script>
